
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Song Form</title>
</head>
<body>
<script src="../utils/api.js"></script>
<div id="react-root"></div>

<h2>Create Song</h2>
<div id="skillInfo">
  Songwriting Level: <span id="skillLevel">1</span>
  <progress id="skillXP" value="0" max="100"></progress>
  <small>Higher levels unlock richer AI drafts.</small>
</div>
<form id="songForm">
  <input type="text" name="title" placeholder="Song Title" required />
  <input type="text" name="duration_sec" placeholder="Duration (sec or mm:ss)" required />
  <input type="text" name="genre" placeholder="Genre" required />

  <label for="themes">Themes (choose up to 3)</label>
  <select id="themes" name="themes" multiple></select>

  <label for="coWriters">Invite Co-writers</label>
  <select id="coWriters" multiple></select>

  <button type="button" id="generateDraft">Generate Draft</button>

  <label for="lyrics">Lyrics</label>
  <textarea id="lyrics" name="lyrics" placeholder="Lyrics"></textarea>

  <label for="chord_progression">Chord Progression</label>
  <input type="text" id="chord_progression" name="chord_progression" placeholder="C G Am F" />

  <div id="artSection">
    <label for="albumArt">Album Art</label>
    <input type="file" id="albumArt" name="album_art" accept="image/*" />
    <button type="button" id="generateArt">Generate AI Art</button>
    <img id="artPreview" alt="Album art preview" />
  </div>

  <select name="distribution_channels" multiple>
    <option value="digital">Digital</option>
    <option value="vinyl">Vinyl</option>
    <option value="streaming">Streaming</option>
  </select>
  <button type="submit">Create Song</button>
</form>
<div>
  <h3>Pending Songwriting Invitations</h3>
  <div id="pendingInvites">No pending invitations.</div>
</div>
<div>
  <h3>Current Collaborators</h3>
  <ul id="collaborators"></ul>
</div>
<div id="completionPanel" hidden>
  <h3>Finish Songwriting</h3>
  <p id="completionStatus">When the song is ready, finish the writing phase to see its quality.</p>
  <button type="button" id="completeSong">Finish Writing</button>
  <button type="button" id="polishSong" hidden>Do Final Polish Session</button>
  <button type="button" id="skipPolish" hidden>Keep Song As-Is</button>
</div>
<script src="../components/globalSearch.js"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script type="module" src="../dist/index.js"></script>
<script>
  let currentDraftId = null;
  let currentDraftSnapshot = null;
  let currentCompletionSummary = null;
  let lastCollaborators = [];

  function loadSkill() {
    apiFetch('/api/songwriting/skill')
      .then(r => r.json())
      .then(s => {
        document.getElementById('skillLevel').textContent = s.level;
        document.getElementById('skillXP').value = s.xp % 100;
      });
  }

  loadSkill();

  async function loadPendingInvites() {
    const container = document.getElementById('pendingInvites');
    try {
      const res = await apiFetch('/api/songwriting/invites');
      if (!res.ok) return;
      const data = await res.json();
      const invites = data.invites || [];
      if (!invites.length) {
        container.textContent = 'No pending invitations.';
        return;
      }

      container.innerHTML = '';
      invites.forEach(invite => {
        const row = document.createElement('div');
        const label = document.createElement('span');
        label.textContent = `${invite.title} (${invite.genre}) — invited by player ${invite.inviter_id} `;
        const accept = document.createElement('button');
        accept.type = 'button';
        accept.textContent = 'Accept';
        accept.addEventListener('click', () => respondToInvite(invite.draft_id, 'accept'));
        const decline = document.createElement('button');
        decline.type = 'button';
        decline.textContent = 'Decline';
        decline.addEventListener('click', () => respondToInvite(invite.draft_id, 'decline'));
        row.append(label, accept, decline);
        container.appendChild(row);
      });
    } catch {
      container.textContent = 'Unable to load songwriting invitations.';
    }
  }

  async function respondToInvite(draftId, action) {
    try {
      const res = await apiFetch(`/api/songwriting/invites/${draftId}/${action}`, {
        method: 'POST'
      });
      if (!res.ok) {
        showNotification(`Unable to ${action} invitation`, 'error');
        return;
      }
      showNotification(
        action === 'accept' ? 'Songwriting invitation accepted' : 'Songwriting invitation declined',
        'success'
      );
      await loadPendingInvites();
    } catch {
      showNotification('Network error', 'error');
    }
  }

  loadPendingInvites();

  function loadBandMembers() {
    const bandId = new URLSearchParams(window.location.search).get('band_id');
    if (!bandId) return;
    apiFetch(`/api/bands/${bandId}`)
      .then(r => r.json())
      .then(b => {
        const sel = document.getElementById('coWriters');
        (b.members || []).forEach(m => {
          const opt = document.createElement('option');
          opt.value = m.user_id;
          opt.textContent = `${m.user_id} (${m.role})`;
          sel.appendChild(opt);
        });
      });
  }

  loadBandMembers();

  apiFetch('/api/songwriting/themes')
    .then(r => r.json())
    .then(list => {
      const sel = document.getElementById('themes');
      list.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t;
        opt.textContent = t;
        sel.appendChild(opt);
      });
    });

  document.getElementById('themes').addEventListener('change', function() {
    const selected = Array.from(this.selectedOptions);
    if (selected.length > 3) {
      selected[0].selected = false;
    }
  });

  async function inviteCowriters(draftId) {
    const ids = Array.from(document.getElementById('coWriters').selectedOptions).map(o => Number(o.value));
    let list = lastCollaborators;
    for (const id of ids) {
      try {
        const res = await apiFetch(`/api/songwriting/drafts/${draftId}/co_writers`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ co_writer_id: id })
        });
        const data = await res.json();
        if (res.ok) {
          list = data.co_writers;
          showNotification(`Invitation sent to ${id}; they must accept before joining the session`, 'success');
        } else {
          showNotification(data.message || data.error || `Failed to invite ${id}`, 'error');
        }
      } catch {
        showNotification('Network error', 'error');
      }
    }
    renderCollaborators(list);
  }

  function renderCollaborators(list) {
    const ul = document.getElementById('collaborators');
    ul.innerHTML = '';
    list.forEach(id => {
      const li = document.createElement('li');
      li.textContent = id;
      ul.appendChild(li);
    });
    lastCollaborators = list.slice();
  }

  function pollCollaborators(draftId) {
    setInterval(async () => {
      try {
        const res = await apiFetch(`/api/songwriting/drafts/${draftId}/co_writers`);
        if (!res.ok) return;
        const data = await res.json();
        const list = data.co_writers || [];
        const newOnes = list.filter(id => !lastCollaborators.includes(id));
        if (newOnes.length) {
          newOnes.forEach(id => showNotification(`Collaborator accepted: ${id}`, 'success'));
        }
        if (newOnes.length || list.length !== lastCollaborators.length) {
          renderCollaborators(list);
        }
      } catch {}
    }, 5000);
  }

  function formatMinutes(total) {
    const hours = Math.floor(total / 60);
    const minutes = total % 60;
    if (hours && minutes) return `${hours}h ${minutes}m`;
    if (hours) return `${hours}h`;
    return `${minutes}m`;
  }

  function renderCompletion(summary) {
    const panel = document.getElementById('completionPanel');
    const status = document.getElementById('completionStatus');
    const complete = document.getElementById('completeSong');
    const polish = document.getElementById('polishSong');
    const skip = document.getElementById('skipPolish');
    panel.hidden = false;

    if (!summary || summary.status !== 'completed') {
      status.textContent = 'When the song is ready, finish the writing phase to see its quality.';
      currentCompletionSummary = null;
      complete.hidden = false;
      polish.hidden = true;
      skip.hidden = true;
      return;
    }

    currentCompletionSummary = summary;
    const time = summary.writing_time;
    const details = [
      `initial ${formatMinutes(time.initial_minutes)}`,
      `${time.revision_sessions} revision session(s) / ${formatMinutes(time.revision_minutes)}`
    ];
    if (time.polish_minutes) details.push(`polish ${formatMinutes(time.polish_minutes)}`);
    status.textContent =
      `Song complete — quality ${summary.quality_score}/100. Writing time: ${formatMinutes(time.total_minutes)} (${details.join(', ')}).`;

    complete.hidden = true;
    document.getElementById('lyrics').readOnly = true;
    document.getElementById('chord_progression').readOnly = true;

    if (summary.polish.available && !summary.polish.attempted) {
      polish.hidden = false;
      skip.hidden = false;
      polish.textContent = `Do Final Polish Session (${summary.polish.success_chance}% chance)`;
    } else {
      polish.hidden = true;
      skip.hidden = true;
      if (summary.polish.attempted) {
        status.textContent += summary.polish.succeeded
          ? ` Polish worked (+${summary.polish.quality_bonus} quality).`
          : ' Polish did not improve the song this time.';
      }
    }
  }

  async function syncDraftBeforeCompletion() {
    if (!currentDraftId || !currentDraftSnapshot) return true;
    const lyrics = document.getElementById('lyrics').value;
    const chord = document.getElementById('chord_progression').value;
    const updates = {};
    if (lyrics !== currentDraftSnapshot.lyrics) updates.lyrics = lyrics;
    if (chord !== currentDraftSnapshot.chord_progression) updates.chord_progression = chord;
    if (!Object.keys(updates).length) return true;

    const res = await apiFetch(`/api/songwriting/drafts/${currentDraftId}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(updates)
    });
    if (!res.ok) return false;
    currentDraftSnapshot = await res.json();
    return true;
  }

  document.getElementById('completeSong').addEventListener('click', async function() {
    if (!currentDraftId) return;
    try {
      const synced = await syncDraftBeforeCompletion();
      if (!synced) {
        showNotification('Unable to save the final songwriting changes', 'error');
        return;
      }
      const res = await apiFetch(`/api/songwriting/drafts/${currentDraftId}/complete`, {
        method: 'POST'
      });
      const data = await res.json();
      if (!res.ok) {
        showNotification(data.detail || 'Unable to complete the song', 'error');
        return;
      }
      renderCompletion(data);
      showNotification(`Song complete — quality ${data.quality_score}/100`, 'success');
    } catch {
      showNotification('Network error', 'error');
    }
  });

  document.getElementById('polishSong').addEventListener('click', async function() {
    if (!currentDraftId) return;
    try {
      const res = await apiFetch(`/api/songwriting/drafts/${currentDraftId}/polish`, {
        method: 'POST'
      });
      const data = await res.json();
      if (!res.ok) {
        showNotification(data.detail || 'Unable to run the polish session', 'error');
        return;
      }
      renderCompletion(data);
      showNotification(
        data.polish.succeeded
          ? `Polish worked! +${data.polish.quality_bonus} quality`
          : 'Polish session finished, but the song did not improve this time',
        data.polish.succeeded ? 'success' : 'info'
      );
      loadSkill();
    } catch {
      showNotification('Network error', 'error');
    }
  });

  document.getElementById('skipPolish').addEventListener('click', async function() {
    if (!currentDraftId) return;
    try {
      const res = await apiFetch(`/api/songwriting/drafts/${currentDraftId}/skip-polish`, {
        method: 'POST'
      });
      const data = await res.json();
      if (!res.ok) {
        showNotification(data.detail || 'Unable to keep the song as-is', 'error');
        return;
      }
      renderCompletion(data);
      showNotification('Song kept at its current quality', 'success');
    } catch {
      showNotification('Network error', 'error');
    }
  });

  document.getElementById('generateDraft').addEventListener('click', async function() {
    const form = document.getElementById('songForm');
    const themes = Array.from(document.getElementById('themes').selectedOptions).map(o => o.value);
    if (themes.length !== 3) {
      showNotification('Select exactly 3 themes', 'error');
      return;
    }
    const payload = {
      title: form.title.value.trim(),
      genre: form.genre.value.trim(),
      themes
    };
    try {
      const res = await apiFetch('/api/songwriting/prompt', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (res.ok) {
        currentDraftId = data.id;
        currentDraftSnapshot = data;
        document.getElementById('lyrics').value = data.lyrics || '';
        document.getElementById('chord_progression').value = data.chord_progression || '';
        document.getElementById('lyrics').readOnly = false;
        document.getElementById('chord_progression').readOnly = false;
        renderCompletion(null);
        showNotification('Draft generated', 'success');
        renderCollaborators([]);
        await inviteCowriters(currentDraftId);
        pollCollaborators(currentDraftId);
      } else {
        showNotification(data.message || data.error || 'Failed to generate draft', 'error');
      }
    } catch {
      showNotification('Network error', 'error');
    }
    loadSkill();
  });

  document.getElementById('songForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const form = e.target;
    const durationInput = form.duration_sec.value.trim();
    if (!/^\d+(?:[:]\d{2})?$/.test(durationInput)) {
      showNotification('Duration must be a number of seconds or mm:ss', 'error');
      return;
    }
    let duration_sec = Number(durationInput);
    if (durationInput.includes(':')) {
      const parts = durationInput.split(':').map(Number);
      duration_sec = parts[0] * 60 + parts[1];
    }
    if (duration_sec <= 0) {
      showNotification('Duration must be positive', 'error');
      return;
    }
    if (currentDraftId) {
      if (!currentCompletionSummary) {
        showNotification('Finish the songwriting phase before creating this song', 'error');
        return;
      }
      if (currentCompletionSummary.polish.available) {
        showNotification('Choose the final polish session or keep the song as-is first', 'error');
        return;
      }
    }
    const bandId = new URLSearchParams(window.location.search).get('band_id');
    if (currentDraftId && !bandId) {
      showNotification('Open Songwriting from a band so the finished song has an owner', 'error');
      return;
    }

    const distributionChannels = Array.from(
      form.distribution_channels.selectedOptions
    ).map(o => o.value);

    const endpoint = currentDraftId
      ? `/api/songwriting/drafts/${currentDraftId}/finalize`
      : '/api/songs';
    const payload = currentDraftId
      ? {
          band_id: Number(bandId),
          duration_sec,
          distribution_channels: distributionChannels
        }
      : {
          band_id: bandId ? Number(bandId) : undefined,
          title: form.title.value.trim(),
          duration_sec,
          genre: form.genre.value.trim(),
          themes: Array.from(document.getElementById('themes').selectedOptions).map(o => o.value),
          lyrics: form.lyrics.value,
          chord_progression: form.chord_progression.value,
          distribution_channels: distributionChannels
        };
    try {
      const res = await apiFetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (res.ok) {
        showNotification(
          currentDraftId && data.already_finalized
            ? 'Song was already created and is in your catalogue'
            : 'Song created successfully',
          'success'
        );
        form.reset();
        currentDraftId = null;
        currentDraftSnapshot = null;
        currentCompletionSummary = null;
        document.getElementById('completionPanel').hidden = true;
      } else {
        showNotification(data.message || data.error || 'Failed to create song', 'error');
      }
    } catch (err) {
      showNotification('Network error', 'error');
    }
  });
</script>
</body>
</html>
